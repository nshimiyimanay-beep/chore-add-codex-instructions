name: Website checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main, 'feat/iso-mega-website-v1']
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript and smoke tests
        run: npm run check
